name: Build stats and deploy to GitHub Pages

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run dandi_stats.py
      env:
        DANDI_API_KEY: ${{ secrets.DANDI_API_KEY }}
      run: python src/dandi_stats.py

    - name: Commit CSVs to repo
      continue-on-error: true
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/*.csv
        if git diff --cached --quiet; then
          echo "No changes to CSVs"
          exit 0
        fi
        git commit -m "Update summary CSVs ($(date -u +%Y-%m-%d))"
        git pull --rebase origin main
        git push origin HEAD:main

    - name: Stage site
      run: |
        mkdir -p _site
        cp src/CNAME _site/
        cp src/index.html _site/
        cp -r img _site/
        cp data/timeseries.csv _site/
        cp data/sizes.csv _site/
        cp data/subjects.csv _site/
        cp data/species.csv _site/
        cp data/modalities.csv _site/

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4