<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DANDI Archive Summary</title>
  <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/dandi/dandi-archive/master/web/public/favicon.ico">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QLDZD3SJ3Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-QLDZD3SJ3Y');
  </script>
  <style>
    body {
      font-family: sans-serif;
      background: #fff;

    }

    @media (max-width: 700px) {
      body { margin: 16px; }

      header img { height: 32px !important; }
      h1 { font-size: 18px; }
    }
  </style>
</head>
<body>
<header>
  <a href="https://dandiarchive.org/" target="_blank" rel="noopener">
    <img src="https://raw.githubusercontent.com/dandi/dandi-archive/master/web/src/assets/logo.svg" alt="DANDI Archive" style="height: 40px; display: block;">
  </a>
</header>
<main>
<h1 id="page-title">DANDI Archive Summary</h1>
<div id="plot"></div>
</main>

<script>
const csvFiles = [
  './timeseries.csv',
  './sizes.csv',
  './subjects.csv',
  './species.csv',
  './modalities.csv',
];

// Image for plot A (inlined as a data URL so it is kept in SVG/PNG downloads)
const toDataURL = url => fetch(url)
  .then(r => r.blob())
  .then(blob => new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  }));
const panelAReady = toDataURL('img/panel-a.svg');

Promise.all(csvFiles.map(f => fetch(f)))
  .then(responses => {
    const lastMod = responses[0].headers.get('Last-Modified');
    if (lastMod) {
      const d = new Date(lastMod);
      if (!isNaN(d)) {
        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const label = `${months[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`;
        const title = `DANDI Archive Summary (${label})`;
        document.getElementById('page-title').textContent = title;
        document.title = title;
      }
    }
    return Promise.all([...responses.map(r => r.text()), panelAReady]);
  })
  .then(([tsText, sizesText, subjectsText, speciesText, modalitiesText, panelASource]) => {

// ---- parse CSV ----
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    const vals = line.split(',');
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (vals[i] || '').trim(); });
    return obj;
  });
}

const OPEN_COLOR = '#0072B2';
const EMB_COLOR  = '#E69F00';
const OPEN_FILL  = 'rgba(0,114,178,0.40)';
const EMB_FILL   = 'rgba(230,159,0,0.40)';

// ---- helpers ----
function buildHistogram(rows) {
  const byBin = new Map();
  rows.forEach(r => {
    const left  = parseFloat(r.bin_left);
    const right = parseFloat(r.bin_right);
    const count = parseInt(r.count, 10) || 0;
    if (!byBin.has(left)) byBin.set(left, { center: (left + right) / 2, width: right - left, open: 0, emb: 0 });
    const bin = byBin.get(left);
    if      (r.access === 'OPEN')      bin.open += count;
    else if (r.access === 'EMBARGOED') bin.emb  += count;
  });
  const sorted = [...byBin.entries()].sort(([a], [b]) => a - b).map(([, v]) => v);
  return {
    centers: sorted.map(b => b.center),
    widths:  sorted.map(b => b.width),
    open:    sorted.map(b => b.open),
    emb:     sorted.map(b => b.emb),
  };
}

function buildAccessCounts(rows, keyCol) {
  const open = {}, emb = {};
  rows.forEach(r => {
    const k = r[keyCol];
    if (!k || k === 'nan') return;
    const count = parseInt(r.count, 10) || 0;
    if      (r.access === 'OPEN')      open[k] = (open[k] || 0) + count;
    else if (r.access === 'EMBARGOED') emb[k]  = (emb[k]  || 0) + count;
  });
  return { open, emb };
}

// ---- Plot B & C: build cumulative series from the monthly time series ----
const tsRows = parseCSV(tsText);
const periods = [...new Set(tsRows.map(r => r.period))].sort();
const byPeriod = {};
periods.forEach(p => { byPeriod[p] = { OPEN: { n: 0, size: 0 }, EMBARGOED: { n: 0, size: 0 } }; });
tsRows.forEach(r => {
  byPeriod[r.period][r.access] = {
    n: parseFloat(r.number_added) || 0,
    size: parseFloat(r.size_added) || 0,
  };
});

const allDates = periods.map(p => p + '-01');
const lineStyle = { width: 1.5, shape: 'linear' };
const lastDate = allDates[allDates.length - 1];

const cumOpenCount = [], cumEmbCount = [], cumTotalCount = [];
const cumOpenSize  = [], cumEmbSize  = [], cumTotalSize  = [];
let openN = 0, embN = 0, openS = 0, embS = 0;
periods.forEach(p => {
  openN += byPeriod[p].OPEN.n;
  embN  += byPeriod[p].EMBARGOED.n;
  openS += byPeriod[p].OPEN.size / 1e15;
  embS  += byPeriod[p].EMBARGOED.size / 1e15;
  cumOpenCount.push(openN);
  cumEmbCount.push(embN);
  cumTotalCount.push(openN + embN);
  cumOpenSize.push(openS);
  cumEmbSize.push(embS);
  cumTotalSize.push(openS + embS);
});

// ---- Plot B: cumulative datasets (open on bottom, embargoed stacked on top) ----
const traceB_open = { type:'scatter', mode:'lines', name:'Open access',      x: allDates, y: cumOpenCount,  line: { ...lineStyle, color: OPEN_COLOR }, fill: 'tozeroy', fillcolor: OPEN_FILL, xaxis:'x',  yaxis:'y',  showlegend:true, legend:'legend',  hovertemplate:'%{x|%b %Y}: %{y}<extra></extra>' };
const traceB_emb  = { type:'scatter', mode:'lines', name:'Embargoed access', x: allDates, y: cumTotalCount, line: { ...lineStyle, color: EMB_COLOR },  fill: 'tonexty', fillcolor: EMB_FILL,  xaxis:'x',  yaxis:'y',  showlegend:true, legend:'legend',  customdata: cumEmbCount, hovertemplate:'%{x|%b %Y}: %{customdata}<extra></extra>' };

const traceC_open = { type:'scatter', mode:'lines', name:'Open access',      x: allDates, y: cumOpenSize,  line: { ...lineStyle, color: OPEN_COLOR }, fill: 'tozeroy', fillcolor: OPEN_FILL, xaxis:'x2', yaxis:'y2', showlegend:true, legend:'legend2', hovertemplate:'%{x|%b %Y}: %{y:.2f}<extra></extra>' };
const traceC_emb  = { type:'scatter', mode:'lines', name:'Embargoed access', x: allDates, y: cumTotalSize, line: { ...lineStyle, color: EMB_COLOR },  fill: 'tonexty', fillcolor: EMB_FILL,  xaxis:'x2', yaxis:'y2', showlegend:true, legend:'legend2', customdata: cumEmbSize, hovertemplate:'%{x|%b %Y}: %{customdata:.2f}<extra></extra>' };

// ---- Plot D: size distribution ----
const sizeHist = buildHistogram(parseCSV(sizesText));
const HIST_BAR_FRACTION = 0.80;
const sizeBarWidths = sizeHist.widths.map(w => w * HIST_BAR_FRACTION);

// open on bottom, embargoed stacked on top (manual stack via `base` so the
// global barmode can be 'group' for plots F and G)
const sizeBarOffsets = sizeBarWidths.map(w => -w / 2);
const traceD_open = { type:'bar', name:'Open access',      x: sizeHist.centers, y: sizeHist.open,                     width: sizeBarWidths, offset: sizeBarOffsets, marker:{ color: OPEN_COLOR }, xaxis:'x3', yaxis:'y3', showlegend:true, legend:'legend3', hovertemplate:'%{y}<extra></extra>' };
const traceD_emb  = { type:'bar', name:'Embargoed access', x: sizeHist.centers, y: sizeHist.emb,  base: sizeHist.open, width: sizeBarWidths, offset: sizeBarOffsets, marker:{ color: EMB_COLOR  }, xaxis:'x3', yaxis:'y3', showlegend:true, legend:'legend3', hovertemplate:'%{y}<extra></extra>' };

// ---- Plot E: subjects distribution ----
const subjHist = buildHistogram(parseCSV(subjectsText));
const subjBarWidths = subjHist.widths.map(w => w * HIST_BAR_FRACTION);

const subjBarOffsets = subjBarWidths.map(w => -w / 2);
const traceE_open = { type:'bar', name:'Open access',      x: subjHist.centers, y: subjHist.open,                     width: subjBarWidths, offset: subjBarOffsets, marker:{ color: OPEN_COLOR }, xaxis:'x4', yaxis:'y4', showlegend:true, legend:'legend4', hovertemplate:'%{y}<extra></extra>' };
const traceE_emb  = { type:'bar', name:'Embargoed access', x: subjHist.centers, y: subjHist.emb,  base: subjHist.open, width: subjBarWidths, offset: subjBarOffsets, marker:{ color: EMB_COLOR  }, xaxis:'x4', yaxis:'y4', showlegend:true, legend:'legend4', hovertemplate:'%{y}<extra></extra>' };

// Shared y-axis range for D and E
const cdDtick = 50;
const cdRawMax = Math.max(
  ...sizeHist.centers.map((_, i) => sizeHist.open[i] + sizeHist.emb[i]),
  ...subjHist.centers.map((_, i) => subjHist.open[i] + subjHist.emb[i]),
);
const cdMax = Math.ceil(cdRawMax / cdDtick) * cdDtick;

// ---- Plot F: species bar chart ----
const { open: openSp, emb: embSp } = buildAccessCounts(parseCSV(speciesText), 'species');
const allSp  = new Set([...Object.keys(openSp), ...Object.keys(embSp)]);
const spTotals = {};
allSp.forEach(s => { spTotals[s] = (openSp[s]||0) + (embSp[s]||0); });

// Group species with fewer than MIN_SPECIES_COUNT datasets into "Other"
const MIN_SPECIES_COUNT = 5;
const spMain  = [...allSp].filter(s => spTotals[s] >= MIN_SPECIES_COUNT);
const spOther = [...allSp].filter(s => spTotals[s] <  MIN_SPECIES_COUNT);
const spSorted = spMain.sort((a, b) => spTotals[b] - spTotals[a]);
if (spOther.length > 0) {
  openSp['Other']   = spOther.reduce((s, k) => s + (openSp[k]||0), 0);
  embSp['Other']    = spOther.reduce((s, k) => s + (embSp[k]||0),  0);
  spTotals['Other'] = openSp['Other'] + embSp['Other'];
  spSorted.push('Other');
}

// horizontal grouped bars; categories reversed so the largest is at the top
const spPlot = [...spSorted].reverse();
const traceF_emb = {
  type: 'bar', orientation: 'h', name: 'Embargoed access',
  y: spPlot, x: spPlot.map(s => embSp[s]||0),
  marker: { color: EMB_COLOR },
  xaxis: 'x5', yaxis: 'y5', showlegend: true, legend: 'legend5',
  hovertemplate: '%{x}<extra></extra>',
};
const traceF_open = {
  type: 'bar', orientation: 'h', name: 'Open access',
  y: spPlot, x: spPlot.map(s => openSp[s]||0),
  marker: { color: OPEN_COLOR },
  xaxis: 'x5', yaxis: 'y5', showlegend: true, legend: 'legend5',
  hovertemplate: '%{x}<extra></extra>',
};

// ---- Plot G: modality bar chart ----
const modalityNames = {
  extracellularephys: 'Extracellular<br>ephys',
  intracellularephys: 'Intracellular<br>ephys',
  opticalphysiology:  'Optical<br>physiology',
  behavior:           'Behavior',
  eyetracking:        'Eye tracking',
  optogenetics:       'Optogenetics',
  fiberphotometry:    'Fiber<br>photometry',
  microscopy:         'Microscopy',
};
const modKeys = Object.keys(modalityNames);

const { open: openMod, emb: embMod } = buildAccessCounts(parseCSV(modalitiesText), 'modality');
modKeys.forEach(m => {
  openMod[m] = openMod[m] || 0;
  embMod[m]  = embMod[m]  || 0;
});
const modTotal = {};
modKeys.forEach(m => { modTotal[m] = (openMod[m]||0) + (embMod[m]||0); });
const modSorted = [...modKeys].sort((a, b) => modTotal[b] - modTotal[a]);

const modPlot = [...modSorted].reverse();
const modPlotLabels = modPlot.map(m => modalityNames[m]);
const traceG_emb = {
  type: 'bar', orientation: 'h', name: 'Embargoed access',
  y: modPlotLabels, x: modPlot.map(m => embMod[m]||0),
  marker: { color: EMB_COLOR },
  xaxis: 'x6', yaxis: 'y6', showlegend: true, legend: 'legend6',
  hovertemplate: '%{x}<extra></extra>',
};
const traceG_open = {
  type: 'bar', orientation: 'h', name: 'Open access',
  y: modPlotLabels, x: modPlot.map(m => openMod[m]||0),
  marker: { color: OPEN_COLOR },
  xaxis: 'x6', yaxis: 'y6', showlegend: true, legend: 'legend6',
  hovertemplate: '%{x}<extra></extra>',
};

// Shared y-axis range for F and G
const spMax  = Math.max(...spSorted.map(s => (openSp[s]||0) + (embSp[s]||0)));
const modMax = Math.max(...modSorted.map(m => modTotal[m]));
const efRawMax = Math.max(spMax, modMax);
const efDtick  = 100;
const efMax    = Math.ceil(efRawMax / efDtick) * efDtick;

// ---- layout ----
// Below this container width the panels are stacked in a single column.
const MOBILE_BREAKPOINT = 700;
const PANEL_A_ASPECT = 988 / 236;  // width / height of img/panel-a.svg
const plotDiv = document.getElementById('plot');
const isMobile = () => plotDiv.clientWidth < MOBILE_BREAKPOINT;

function buildLayout(mobile) {
  const fs = mobile
    ? { tick: 11, title: 13, legend: 11, label: 18 }
    : { tick: 13, title: 16, legend: 13, label: 20 };

  const axBase = {
    showline: true, linecolor: '#000000', linewidth: 0.8,
    ticks: 'outside', ticklen: 4, tickwidth: 0.8, tickcolor: '#000000',
    showgrid: false, zeroline: false, mirror: false,
    tickfont: { size: fs.tick },
  };
  const yBase = {
    ...axBase,
    showgrid: true,
    gridcolor: '#E6E6E6', gridwidth: 0.5, griddash: 'solid',
  };
  const title = text => ({ text, font: { size: fs.title } });
  const legendBase = { traceorder: 'reversed', font: { size: fs.legend } };
  const label = (text, x, y, extra = {}) =>
    ({ text: `<b>${text}</b>`, xref: 'paper', yref: 'paper', x, y, showarrow: false, font: { size: fs.label }, ...extra });

  // Per-panel geometry. Desktop: 2-column grid in paper coordinates.
  // Mobile: one column; heights are laid out in pixels and converted to paper
  // coordinates below.
  let height, margin, geom, imageA, legendPos, labels;

  if (!mobile) {
    height = 1600;
    margin = { t: 50, b: 80, l: 100, r: 20 };
    const L = [0.0, 0.44], R = [0.58, 1.0];
    geom = {
      B: { x: L, y: [0.552, 0.742] }, C: { x: R, y: [0.552, 0.742] },
      D: { x: L, y: [0.276, 0.466] }, E: { x: R, y: [0.276, 0.466] },
      F: { x: L, y: [0.0, 0.19] },    G: { x: R, y: [0.0, 0.19] },
    };
    imageA = { x: -0.04, y: 1.0, sizex: 1.04, sizey: 0.2 };
    legendPos = {
      legend:  { x: 0.01, y: 0.742, xanchor: 'left',  yanchor: 'top' },
      legend2: { x: 0.59, y: 0.742, xanchor: 'left',  yanchor: 'top' },
      legend3: { x: 0.44, y: 0.466, xanchor: 'right', yanchor: 'top' },
      legend4: { x: 1.00, y: 0.466, xanchor: 'right', yanchor: 'top' },
      legend5: { x: 0.44, y: 0.01,  xanchor: 'right', yanchor: 'bottom' },
      legend6: { x: 1.00, y: 0.01,  xanchor: 'right', yanchor: 'bottom' },
    };
    labels = [
      label('A', -0.05, 1.03),
      label('B', -0.05, 0.772), label('C', 0.53, 0.772),
      label('D', -0.05, 0.496), label('E', 0.53, 0.496),
      label('F', -0.05, 0.22),  label('G', 0.53, 0.22),
    ];
  } else {
    margin = { t: 40, b: 10, l: 90, r: 12 };
    const W = plotDiv.clientWidth;
    const plotW = Math.max(W - margin.l - margin.r, 1);
    const LABEL_H = 34;   // row holding the panel letter above each panel
    const AXIS_H  = 62;   // tick labels + axis title below each panel
    const imgH = W / PANEL_A_ASPECT;
    const panels = [
      { key: 'A', h: imgH, axis: 16 },
      { key: 'B', h: 220 }, { key: 'C', h: 220 },
      { key: 'D', h: 220 }, { key: 'E', h: 220 },
      { key: 'F', h: 280 }, { key: 'G', h: 260 },
    ];
    const total = panels.reduce((s, p) => s + LABEL_H + p.h + (p.axis ?? AXIS_H), 0);
    height = Math.round(total + margin.t + margin.b);
    const toY = px => 1 - px / total;

    const full = [0, 1];
    const leftEdge = -margin.l / plotW;  // paper x of the container's left edge
    geom = {};
    labels = [];
    let px = 0;
    panels.forEach(p => {
      labels.push(label(p.key, leftEdge, toY(px), { xanchor: 'left', yanchor: 'top' }));
      px += LABEL_H;
      geom[p.key] = { x: full, y: [toY(px + p.h), toY(px)] };
      px += p.h + (p.axis ?? AXIS_H);
    });
    imageA = { x: leftEdge, y: geom.A.y[1], sizex: W / plotW, sizey: geom.A.y[1] - geom.A.y[0] };
    const top = k => ({ y: geom[k].y[1] });
    const bottom = k => ({ y: geom[k].y[0] + 0.002 });
    legendPos = {
      legend:  { x: 0.02, ...top('B'),    xanchor: 'left',  yanchor: 'top' },
      legend2: { x: 0.02, ...top('C'),    xanchor: 'left',  yanchor: 'top' },
      legend3: { x: 1.00, ...top('D'),    xanchor: 'right', yanchor: 'top' },
      legend4: { x: 1.00, ...top('E'),    xanchor: 'right', yanchor: 'top' },
      legend5: { x: 1.00, ...bottom('F'), xanchor: 'right', yanchor: 'bottom' },
      legend6: { x: 1.00, ...bottom('G'), xanchor: 'right', yanchor: 'bottom' },
    };
  }

  const legends = {};
  Object.entries(legendPos).forEach(([k, v]) => { legends[k] = { ...v, ...legendBase }; });

  return {
    barmode: 'group',
    bargap: 0.3,
    paper_bgcolor: '#fff',
    plot_bgcolor: '#fff',
    font: { family: 'sans-serif', size: 12, color: '#000000' },
    height,
    margin,

    // ---- Plot A: data sources ----
    images: [{
      source: panelASource,
      xref: 'paper', yref: 'paper',
      ...imageA,
      xanchor: 'left', yanchor: 'top',
      sizing: 'contain', layer: 'above',
    }],

    // per-subplot legends (embargoed listed above open, matching the stacks)
    ...legends,

    annotations: labels,

    // B - cumulative datasets
    xaxis: {
      ...axBase,
      domain: geom.B.x, anchor: 'y',
      type: 'date',
      tick0: '2020-01-01', dtick: 'M12', tickformat: '%Y',
      range: ['2020-01-01', lastDate],
      title: title('Date'),
    },
    yaxis: {
      ...yBase,
      domain: geom.B.y, anchor: 'x',
      rangemode: 'tozero',
      title: title('Datasets (#)'),
    },

    // C - cumulative size
    xaxis2: {
      ...axBase,
      domain: geom.C.x, anchor: 'y2',
      type: 'date',
      tick0: '2020-01-01', dtick: 'M12', tickformat: '%Y',
      range: ['2020-01-01', lastDate],
      title: title('Date'),
    },
    yaxis2: {
      ...yBase,
      domain: geom.C.y, anchor: 'x2',
      rangemode: 'tozero',
      title: title('Size (PB)'),
    },

    // D - size distribution
    xaxis3: {
      ...axBase,
      domain: geom.D.x, anchor: 'y3',
      tickmode: 'array',
      tickvals: [3, 6, 9, 12, 15],
      ticktext: ['KB', 'MB', 'GB', 'TB', 'PB'],
      range: [2, 16],
      title: title('Dataset size'),
    },
    yaxis3: {
      ...yBase,
      domain: geom.D.y, anchor: 'x3',
      title: title('Datasets (#)'),
      range: [0, cdMax], dtick: cdDtick,
    },

    // E - subjects distribution
    xaxis4: {
      ...axBase,
      domain: geom.E.x, anchor: 'y4',
      tickmode: 'array',
      tickvals: [0, 1, 2, 3],
      ticktext: ['1', '10', '100', '1000'],
      range: [0, 4],
      title: title('Number of subjects'),
    },
    yaxis4: {
      ...yBase,
      domain: geom.E.y, anchor: 'x4',
      title: title('Datasets (#)'),
      range: [0, cdMax], dtick: cdDtick,
    },

    // F - species (horizontal bars)
    xaxis5: {
      ...yBase,
      domain: geom.F.x, anchor: 'y5',
      title: title('Datasets (#)'),
      range: [0, efMax], dtick: efDtick,
    },
    yaxis5: {
      ...axBase,
      domain: geom.F.y, anchor: 'x5',
    },

    // G - modality (horizontal bars)
    xaxis6: {
      ...yBase,
      domain: geom.G.x, anchor: 'y6',
      title: title('Datasets (#)'),
      range: [0, efMax], dtick: efDtick,
    },
    yaxis6: {
      ...axBase,
      domain: geom.G.y, anchor: 'x6',
    },
  };
}

const traces = [
  traceB_open, traceB_emb,
  traceC_open, traceC_emb,
  traceD_open, traceD_emb,
  traceE_open, traceE_emb,
  traceF_emb,  traceF_open,
  traceG_emb,  traceG_open,
];

const downloadIcon = {
  width: 500,
  height: 500,
  path: 'M250,370 L80,210 L170,210 L170,60 L330,60 L330,210 L420,210 Z M60,420 L440,420 L440,470 L60,470 Z',
};

// Downloads always use the full two-column figure, even on small screens.
const DESKTOP_EXPORT_WIDTH = 1300;
function downloadFigure(gd, format) {
  const opts = { format, filename: 'dandi_archive_summary' };
  if (!isMobile()) return Plotly.downloadImage(gd, opts);
  const layout = buildLayout(false);
  const figure = { data: JSON.parse(JSON.stringify(gd.data)), layout };
  return Plotly.downloadImage(figure, { ...opts, width: DESKTOP_EXPORT_WIDTH, height: layout.height });
}

let mobileLayout = isMobile();
Plotly.newPlot('plot', traces, buildLayout(mobileLayout), {
  responsive: true,
  displayModeBar: true,
  modeBarButtonsToRemove: ['toImage'],
  modeBarButtonsToAdd: [
    {
      name: 'Download SVG',
      icon: downloadIcon,
      click: gd => downloadFigure(gd, 'svg'),
    },
    {
      name: 'Download PNG',
      icon: Plotly.Icons.camera,
      click: gd => downloadFigure(gd, 'png'),
    },
  ],
}).then(gd => {
  // Switch between the stacked (mobile) and grid (desktop) layouts on resize.
  // The mobile layout depends on the width (panel A's height), so it is
  // rebuilt on every resize; the desktop layout only when crossing over.
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const mobile = isMobile();
      if (mobile || mobile !== mobileLayout) {
        mobileLayout = mobile;
        Plotly.react(gd, gd.data, buildLayout(mobile));
      }
    }, 150);
  });

  // The embargoed traces in B-E are drawn stacked on top of the open traces,
  // so when 'Open access' is toggled off via the legend they would float at
  // their stacked height. Re-anchor them to the x-axis whenever that happens.
  const stackSync = [
    { open: traces.indexOf(traceB_open), emb: traces.indexOf(traceB_emb), attr: 'y',    shown: cumTotalCount, hidden: cumEmbCount },
    { open: traces.indexOf(traceC_open), emb: traces.indexOf(traceC_emb), attr: 'y',    shown: cumTotalSize,  hidden: cumEmbSize },
    { open: traces.indexOf(traceD_open), emb: traces.indexOf(traceD_emb), attr: 'base', shown: sizeHist.open, hidden: 0 },
    { open: traces.indexOf(traceE_open), emb: traces.indexOf(traceE_emb), attr: 'base', shown: subjHist.open, hidden: 0 },
  ];
  let syncing = false;
  gd.on('plotly_restyle', () => {
    if (syncing) return;
    const updates = [];
    stackSync.forEach(p => {
      const v = gd.data[p.open].visible;
      const openVisible = v === undefined || v === true;
      const want = openVisible ? p.shown : p.hidden;
      if (gd.data[p.emb][p.attr] !== want) updates.push([{ [p.attr]: [want] }, [p.emb]]);
    });
    if (!updates.length) return;
    syncing = true;
    Promise.all(updates.map(([u, t]) => Plotly.restyle(gd, u, t))).then(() => { syncing = false; });
  });
});

}); // end fetch .then
</script>
</body>
</html>
